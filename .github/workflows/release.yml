name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time, so each run sees the tag created by the previous one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and full history for versioning

      - name: Compute version
        id: version
        run: |
          version=$(bash .github/scripts/next-version.sh)
          if [[ -z $version ]]; then
            echo "HEAD is already released; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(git rev-list --count HEAD)
          echo "Version $version (code $code)"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'
        with:
          gradle-version: "8.9" # same as docker/Dockerfile

      - name: Decode signing key
        if: steps.version.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z $KEYSTORE_BASE64 ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a throwaway debug key and cannot upgrade an existing install."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Test and build
        if: steps.version.outputs.skip != 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          gradle --no-daemon testDebugUnitTest assembleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}
          -PappBuildTime=$(date +%s%3N)

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk="esphome-controller-v$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "v$VERSION" "$apk" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
